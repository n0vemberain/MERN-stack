<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubble</title>
    <style>
        body{
            border: 2px solid purple;
            padding: 20px;
        }
        section{
            border: 2px solid purple;
            padding: 20px;
        }
        ol{
            border: 2px solid purple;
            padding: 20px;
        }
        li{
            border: 2px solid purple;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Explore Event Bubble</h1>
    <section id="list-container">
        <h3>List of things</h3>
        <ol id="item-list">
            <li id="item-1">Lorem, ipsum.</li>
            <li id="item-2">Quam, est.</li>
            <li id="item-3">Architecto, culpa!</li>
            <li id="item-4">Tempore, reiciendis!</li>
            <li id="item-5">Nesciunt, expedita!</li>
            <li id="item-6">Obcaecati, voluptates.</li>
        </ol>
    </section>
    <script>
        // list item-2 click event
        document.getElementById('item-2').addEventListener('click', function(event){
            console.log('item 2 clicked');
            console.log(event.target.innerText);
            event.stopPropagation();
            
        });
        // ol click event
        document.getElementById('item-list').addEventListener('click', function(event){
            console.log('ol clicked');
            console.log(event.target.innerText);
        });
        // section click event
        document.getElementById('list-container').addEventListener('click', function(event){
            console.log('Section clicked');
            console.log(event.target.innerText);
        });

        
    </script>
</body>
</html>
