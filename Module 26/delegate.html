<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Delegate</title>
</head>
<body>
    <h1>Explore the concept of Event Delegate</h1>
    <ol id="item-list">
        <li class="item">My Awesome Item 1</li>
        <li class="item">My Awesome Item 2</li>
        <li class="item">My Awesome Item 3</li>
        <li class="item">My Awesome Item 4</li>
        <li class="item">My Awesome Item 5</li>
        <li class="item">My Awesome Item 6</li>
    </ol>
    <button id="btn-add-new-item">Add New Item</button>
    <script>
        // const itemList = document.getElementsByClassName('item');
        // console.log(itemList);
        // for(const item of itemList){
        //     item.addEventListener('click', function(event){
        //         // console.log('item clicked:', event.target.innerText);
        //         // console.log('item clicked:', event.target.parentNode);

        //         event.target.parentNode.removeChild(event.target); // removing the clicked item
        //     });
        // }
        document.getElementById('item-list').addEventListener('click', function(event){
            event.target.parentNode.removeChild(event.target); // removing the clicked item
        });

        document.getElementById('btn-add-new-item').addEventListener('click', function(){
            // parent to be added
            const ol = document.getElementById('item-list');
            // create new li element
            const li = document.createElement('li');
            li.innerText = 'My New Awesome Item';

            li.classList.add('item');
            //add the item class
            ol.appendChild(li);
        })
    </script>
</body>
</html>
