<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-800">
    <section class="max-w-md min-h-screen mx-auto py-6 bg-gray-200">
        <header>
            <nav>
                <div class="flex justify-center mt-10">
                    <img class="h-28" src="/Module 27/payoo.png" alt="">
                </div>
            </nav>
        </header>

        <!-- login section -->
        <div class="hero flex justify-center mt-12">
            <div class="hero-content flex-col lg:flex-row-reverse">
                <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
                    <div class="card-body">
                        <fieldset class="fieldset">
                            <label class="label">Account Number</label>
                            <input type="number" class="input" placeholder="type your number" />
                            <label class="label">Pin</label>
                            <input type="text" class="input" placeholder="type your pin" />
                            <div><a class="link link-hover">Forgot pin?</a></div>
                            <button class="btn btn-neutral mt-4">Login</button>
                        </fieldset>
                    </div>
                </div>
            </div>
        </div>

    </section>

</body>

</html>
