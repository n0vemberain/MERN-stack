<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-cyan-700">
    <section class="max-w-md min-h-screen mx-auto py-6 bg-gray-200 flex flex-col justify-center">

        <head>
            <section class="flex justify-center">
                <img class="h-16" src="./payoo.png" alt="">
            </section>
        </head>


        <!-- log in section -->
        <section>
            <div class="hero mt-16">

                    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
                        <div class="card-body">
                            <fieldset class="fieldset">
                                <label class="label">Email</label>
                                <input id="email" type="email" class="input" placeholder="Email" />
                                <label class="label">Password</label>
                                <input id="password" type="password" class="input" placeholder="Password" />
                                <div><a class="link link-hover">Forgot password?</a></div>
                                <button id="login-btn" class="btn btn-neutral mt-4">Login</button>
                            </fieldset>
                        </div>
                    </div>
            </div>
        </section>
    </section>

    <script src="./login.js"></script>
</body>

</html>
